baseURL = "https://docs.exam.tools/"
title = "ExamTools Documentation"
theme = "hextra"
enableGitInfo = true
enableRobotsTXT = true
defaultContentLanguage = "en"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  description = "Documentation for ExamTools — the modern amateur radio exam platform"
  [params.editURL]
    enable = true
    base = "https://github.com/HamStudy/examtools-docs/edit/master/content/"

  [params.navbar]
    displayTitle = true
    displayLogo = false
    width = "wide"

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"

  [params.sidebar]
    width = 320


[frontmatter]
  date     = ["date", "publishDate", "lastmod", ":git"]
  lastmod  = [":git", "lastmod", "date", "publishDate"]

[menu]
  [[menu.main]]
    name       = "Docs"
    pageRef    = "/docs"
    weight     = 1
  [[menu.main]]
    name       = "About"
    pageRef    = "/docs/about"
    weight     = 2
  [[menu.main]]
    name       = "GitHub"
    url        = "https://github.com/HamStudy/examtools-docs"
    weight     = 3
    [menu.main.params]
      type = "github"
